<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 500 500" width="1080" height="1080">
  <rect x="-90" y="-90" width="500" height="500" fill="#DF7E30"/>
  <g transform="translate(320 0) scale(-1 1)" fill="none" stroke="#0D0D0D" stroke-width="22">
    <!-- one 5.6s loop. line draws 0.1-1.1s (right to left), the two arcs start only when it has reached the left end (1.1-2.1s), hold to 3.1s,
         then the line erases 3.1-4.1s and the arcs start to erase only when that has reached the left end (4.1-5.1s) -->
    <path d="M22 160 H298" stroke-dasharray="276 276" stroke-dashoffset="276">
      <animate attributeName="stroke-dashoffset" begin="-2.4s" dur="5.6s" repeatCount="indefinite" calcMode="spline"
        values="276;276;0;0;-276;-276" keyTimes="0;0.0179;0.1964;0.5536;0.7321;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1;0.65 0 0.35 1;0 0 1 1"/>
    </path>
    <path d="M298 160 A138 138 0 0 1 160 22" stroke-dasharray="216.8 216.8" stroke-dashoffset="216.8">
      <animate attributeName="stroke-dashoffset" begin="-2.4s" dur="5.6s" repeatCount="indefinite" calcMode="spline"
        values="216.8;216.8;0;0;-216.8;-216.8" keyTimes="0;0.1964;0.375;0.7321;0.9107;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1;0.65 0 0.35 1;0 0 1 1"/>
    </path>
    <path d="M22 160 A138 138 0 0 1 160 298" stroke-dasharray="216.8 216.8" stroke-dashoffset="216.8">
      <animate attributeName="stroke-dashoffset" begin="-2.4s" dur="5.6s" repeatCount="indefinite" calcMode="spline"
        values="216.8;216.8;0;0;-216.8;-216.8" keyTimes="0;0.1964;0.375;0.7321;0.9107;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1;0.65 0 0.35 1;0 0 1 1"/>
    </path>
  </g>
</svg>
